[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdisco"
version = "0.1.0"
description = "s-Disco & Baseline Models for ICML"
requires-python = ">=3.9"
dependencies = [
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pillow>=9.5.0",
    "transformers>=4.30.0",
    "tqdm>=4.65.0",
    "wandb>=0.15.0",
    "h5py>=3.8.0",
    "scikit-image>=0.20.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "ICML*"]