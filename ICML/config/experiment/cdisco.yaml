debiasing_method: cdisco

experiment_dir: opt_${predictor.encoder_type}_method_${predictor.method}_${predictor.optimizer_cfg.name}/lr_start_${predictor.optimizer_cfg.lr}_lr_end_${predictor.optimizer_cfg.lr_end}/bw_${predictor.bw}/cdcor_lambda_${predictor.cdcor_lambda}/warmup_${predictor.warmup_ratio}/seed_${seed}

hydra:
  sweeper:
    params:
      +seed: 42
      +predictor.bw: 1.0, 0.9, 0.5, 0.1, 0.01, 0.001
      +predictor.cdcor_lambda: 10.0, 5.0, 2.0, 1.0, 0.5, 0.1
      +predictor.warmup_ratio: 0.0
      +predictor.method: sdisco
